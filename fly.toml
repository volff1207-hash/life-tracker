# Название приложения — измени на своё уникальное (только буквы, цифры, дефис)
app = "life-tracker-slava"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "life_tracker_data"
  destination = "/data"
